[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airstrings"
version = "0.1.0"
description = "Play guitar and piano in the air with your hands and a webcam."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "mediapipe>=0.10.14",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
airstrings = "airstrings.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
